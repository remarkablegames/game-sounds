name: build

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Random seed for reproducible sounds'
        required: false
        type: number
        default: 1337
      db:
        description: 'Target peak level in dBFS for all sounds'
        required: false
        type: number
        default: -1.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate sounds
        run: python3 generate.py --out sounds --format all --seed ${{ inputs.seed }} --db ${{ inputs.db }}

      - name: Zip sounds
        run: zip -r sounds.zip sounds/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: game-sounds
          path: sounds.zip

name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate sounds
        run: python3 generate.py --out sounds --format all

      - name: Zip sounds
        run: zip -r sounds.zip sounds/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: game-sounds
          path: sounds.zip
